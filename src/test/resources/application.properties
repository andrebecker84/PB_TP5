# ──────────────────────────────────────────────────────────────────────────────
# Configurações para ambiente de teste — H2 em memória
#
# Sobrepõe o application.properties principal para todos os testes automatizados,
# garantindo isolamento completo do banco de produção/dev.
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=false

# Desabilita data.sql nos testes — cada teste popula seu próprio estado via @BeforeEach
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

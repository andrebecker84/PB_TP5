spring.application.name=saikoo

# ──────────────────────────────────────────────────────────────────────────────
# Datasource — PostgreSQL
#
# Em produção (Render), as variáveis de ambiente DATABASE_URL, DB_USERNAME e
# DB_PASSWORD são injetadas automaticamente pelo serviço de banco de dados.
#
# Para desenvolvimento local com PostgreSQL:
#   1. Crie o banco: createdb saikoo
#   2. Defina as variáveis de ambiente antes de `mvn spring-boot:run`:
#        DATABASE_URL=jdbc:postgresql://localhost:5432/saikoo
#        DB_USERNAME=postgres
#        DB_PASSWORD=sua_senha
#   3. Ou use o perfil dev com H2: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/saikoo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# data.sql com INSERT ... ON CONFLICT DO NOTHING — seguro para reinicializações
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=false
spring.messages.encoding=UTF-8
spring.main.banner-mode=off

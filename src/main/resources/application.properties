spring.application.name=saikoo

# ──────────────────────────────────────────────────────────────────────────────
# Datasource — PostgreSQL
#
# Em produção (Render), as variáveis de ambiente DATABASE_URL, DB_USERNAME e
# DB_PASSWORD são injetadas automaticamente pelo serviço de banco de dados.
#
# Para desenvolvimento local com PostgreSQL:
#   1. Crie o banco: createdb saikoo
#   2. Defina as variáveis de ambiente antes de `mvn spring-boot:run`:
#        DATABASE_URL=jdbc:postgresql://localhost:5432/saikoo
#        DB_USERNAME=postgres
#        DB_PASSWORD=sua_senha
#   3. Ou use o perfil dev com H2: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/saikoo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# data.sql com INSERT ... ON CONFLICT DO NOTHING — seguro para reinicializações
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=false
spring.messages.encoding=UTF-8
spring.main.banner-mode=off

# ──────────────────────────────────────────────────────────────────────────────
# Segurança de sessão
#
# tracking-modes=cookie: desabilita URL rewriting de sessão, eliminando a
# exposição do jsessionid na URL e no cabeçalho Referer (CWE-598).
# same-site=strict: o cookie de sessão não é enviado em requisições cross-site,
# o que mitiga CSRF sem dependência de Spring Security.
# http-only=true: impede acesso ao cookie via JavaScript (proteção contra XSS).
# ──────────────────────────────────────────────────────────────────────────────
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true

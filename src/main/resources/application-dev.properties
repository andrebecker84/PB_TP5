# ──────────────────────────────────────────────────────────────────────────────
# Perfil dev — H2 em memória para desenvolvimento local sem PostgreSQL
#
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#      ou defina SPRING_PROFILES_ACTIVE=dev na IDE
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Justificativa: data.sql usa sintaxe ON CONFLICT (PostgreSQL). Como o H2
# recria o schema do zero a cada startup (create-drop), não há risco de
# conflito — usamos um arquivo separado com INSERTs simples.
spring.sql.init.data-locations=classpath:data-dev.sql

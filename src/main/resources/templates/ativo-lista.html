<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: layout(~{::title}, ~{::content}, ~{})}"
>
  <head>
    <title th:fragment="title">Meu Portfólio | SAIKOO</title>
  </head>
  <body>
    <div th:fragment="content">
      <header class="mb-5 d-flex justify-content-between align-items-end">
        <div>
          <h6 class="text-uppercase text-primary fw-bold mb-1">Portfólio</h6>
          <h1 class="fw-extrabold mb-0">Gestão de Ativos</h1>
        </div>
        <div>
          <a href="/ativos/novo" class="btn btn-primary px-4 py-2">
            <i class="bi bi-plus-lg me-2"></i> Adicionar Ativo
          </a>
        </div>
      </header>

      <div class="card border-0 shadow-sm overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="bg-dark bg-opacity-25">
              <tr>
                <th class="ps-4">Ticker / Código</th>
                <th>Nome do Ativo</th>
                <th>Tipo</th>
                <th>Categoria</th>
                <th class="text-end">Preço Médio</th>
                <th class="text-end">Quantidade</th>
                <th class="text-end">Total Investido</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="ativo : ${ativos}">
                <td class="ps-4">
                  <span
                    class="fw-bold text-primary px-2 py-1 bg-primary bg-opacity-10 rounded"
                    th:text="${ativo.ticker}"
                    style="font-family: &quot;Courier New&quot;, monospace"
                    >AAPL</span
                  >
                </td>
                <td th:text="${ativo.nome}" class="fw-medium">Apple Inc.</td>
                <td>
                  <span
                    th:class="${'badge badge-tipo bg-dark border text-light badge-tipo-' + ativo.tipo.toString().toLowerCase()}"
                    th:text="${ativo.tipo}"
                    >AÇÃO</span
                  >
                  <span
                    th:if="${ativo.categoria.toString() == 'RENDA_FIXA' || ativo.tipo.toString() == 'RENDA_FIXA'}"
                    class="badge badge-tipo bg-dark border text-light badge-ref-selic ms-1"
                  >
                    REF: SELIC
                  </span>
                </td>
                <td th:text="${ativo.categoria}" class="small text-muted">
                  RENDA VARIAVEL
                </td>
                <td class="text-end fw-semibold text-main">
                  <span class="currency-symbol">R$</span
                  ><span
                    th:text="${#numbers.formatDecimal(ativo.precoMedio, 1, 'POINT', 2, 'COMMA')}"
                    >0,00</span
                  >
                </td>
                <td class="text-end text-muted" th:text="${ativo.quantidade}">
                  0.0
                </td>
                <td class="text-end fw-bold text-primary">
                  <span class="currency-symbol">R$</span
                  ><span
                    th:text="${#numbers.formatDecimal(ativo.valorInvestido, 1, 'POINT', 2, 'COMMA')}"
                    >0,00</span
                  >
                </td>
                <td class="text-center">
                  <div class="btn-group btn-group-sm">
                    <a
                      th:href="@{/ativos/editar/{id}(id=${ativo.id})}"
                      class="btn btn-outline-info border-info"
                    >
                      <i class="bi bi-pencil"></i>
                    </a>
                    <a
                      th:href="@{/ativos/excluir/{id}(id=${ativo.id})}"
                      class="btn btn-outline-danger"
                      onclick="
                        return confirm(
                          'Tem certeza que deseja remover este ativo do portfólio?',
                        );
                      "
                    >
                      <i class="bi bi-trash"></i>
                    </a>
                  </div>
                </td>
              </tr>
              <tr th:if="${ativos.isEmpty()}">
                <td colspan="8" class="text-center py-5">
                  <i class="bi bi-inbox fs-1 d-block mb-3 opacity-25"></i>
                  <p class="text-muted">
                    Seu portfólio está vazio. Comece adicionando seu primeiro
                    investimento!
                  </p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>

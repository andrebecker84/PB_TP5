# ──────────────────────────────────────────────────────────────────────────────
# Keep-Alive — Previne hibernação do serviço Render · SAIKOO (PB_TP5)
#
# Justificativa: o free tier do Render hiberna serviços após 15 minutos sem
# requisições. Este workflow dispara a cada 10 minutos via cron schedule e faz
# um GET no endpoint de saúde da aplicação, mantendo-a ativa sem custo adicional.
#
# Trigger:
#   • schedule: cron a cada 10 minutos (dias úteis, horário comercial)
#   • workflow_dispatch: execução manual para teste imediato
#
# Observação: o GitHub Actions não garante execução no segundo exato do cron,
# mas a margem de atraso típica (1-3 min) é suficiente para prevenir sleep.
# ──────────────────────────────────────────────────────────────────────────────
name: Keep-Alive — Render

on:
  # Justificativa: cron restrito ao horário comercial de Brasília (UTC-3) em
  # dias úteis reduz consumo de minutos do runner sem deixar o serviço hibernar
  # durante o uso esperado pelo professor/avaliador.
  # Formato: minuto hora dia-mês mês dia-semana (UTC)
  # "*/10 11-22 * * 1-5" = a cada 10 min, das 08h às 19h (BRT), seg–sex
  schedule:
    - cron: '*/10 11-22 * * 1-5'

  # Justificativa: permite disparar manualmente para verificar se o serviço
  # está respondendo antes de uma demonstração ou avaliação.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping — manter serviço Render ativo
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      # Justificativa: o endpoint /ativos/dashboard é a rota principal da
      # aplicação — um GET bem-sucedido confirma que o serviço está ativo e
      # o contexto Spring foi carregado corretamente após o wake-up.
      - name: Ping da aplicação em produção
        env:
          APP_URL: ${{ secrets.PROD_APP_URL }}
        run: |
          echo "::notice::Ping em $APP_URL"
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 30 --retry 2 --retry-delay 5 \
            "$APP_URL/ativos/dashboard")
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "::notice::Serviço respondeu com HTTP $STATUS — ativo."
          else
            echo "::warning::Serviço respondeu com HTTP $STATUS — verifique o dashboard do Render."
          fi

      - name: Registrar resultado no resumo
        if: always()
        run: |
          echo "## Keep-Alive — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ping disparado para manter o serviço Render ativo." >> $GITHUB_STEP_SUMMARY
